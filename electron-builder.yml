# Settings for packaging VAIA into a Mac .app and .dmg (npm run build:mac)
appId: com.vaia.browser
productName: VAIA
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.productivity
  # "-" = a free ad-hoc signature. It keeps the app intact on Apple Silicon, but it
  # isn't an Apple Developer ID, so macOS asks you to "Open Anyway" the first time.
  identity: "-"
  # Only needed for Apple notarization (which needs a paid Developer ID anyway).
  hardenedRuntime: false
  extendInfo:
    # What macOS shows when a website in VAIA asks for these (macOS asks you once for VAIA itself).
    NSCameraUsageDescription: Websites you allow can use your camera, for example for video calls.
    NSMicrophoneUsageDescription: Websites you allow can use your microphone, for example for calls.
    NSLocationUsageDescription: Websites you allow can see your location, for example for maps.
    NSLocationWhenInUseUsageDescription: Websites you allow can see your location, for example for maps.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Web Page
        CFBundleTypeRole: Viewer
        LSItemContentTypes:
          - public.html
          - public.xhtml
  target:
    - target: dmg
      arch:
        - arm64
        - x64
dmg:
  title: VAIA ${version}
  artifactName: VAIA-${version}-${arch}.dmg
# Lets macOS offer VAIA as the default web browser.
protocols:
  - name: Web Page
    schemes:
      - http
      - https
