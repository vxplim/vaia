<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#7fb89b"/>
      <stop offset="1" stop-color="#24574a"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#efe6d2"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#bfe0cc"/>
      <stop offset="1" stop-color="#e6f4ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b2a22" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>
  <g transform="translate(512 770)" filter="url(#soft)">
    <g transform="rotate(-26)">
      <path d="M0 0 C 130 -120, 130 -330, 0 -470 C -130 -330, -130 -120, 0 0 Z" fill="url(#leafA)"/>
      <path d="M0 -20 L0 -400" stroke="#24574a" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g transform="rotate(26)">
      <path d="M0 0 C 130 -120, 130 -330, 0 -470 C -130 -330, -130 -120, 0 0 Z" fill="url(#leafB)"/>
      <path d="M0 -20 L0 -400" stroke="#24574a" stroke-opacity="0.22" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
</svg>
